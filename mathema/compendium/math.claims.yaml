# Claims about the standard math module's functions. The raise regions
# of sqrt, log, asin and acos ship registered in code
# (symbolic/_partiality.py) and are not repeated here.
compendium: math
versions: "*"

math.sqrt:
  intent: "Square root; raises ValueError for x < 0 and never returns a complex result."
  claims:
    - name: sqrt_nonneg
      statement: "for x in [0, inf], f(x) >= 0"

math.exp:
  intent: "Exponential; raises OverflowError above roughly x = 709.78."
  claims:
    - name: exp_positive
      statement: "for x in [-700, 700], f(x) > 0"

math.log:
  intent: "Natural logarithm; raises ValueError at x <= 0 (math.log(0) does not return -inf)."
  claims:
    - name: log_monotone
      statement: "for x in (0, inf], d(f(x), x) > 0"
