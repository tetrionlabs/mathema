# Rows for the pandas.Series methods that move elements between
# positions, stated over Series with nothing missing; the receiver of
# `prices.shift()` is `a`. A shift leaves its first `periods`
# positions missing (and diff and pct_change, read from a shift, do
# too), so each row states the positions that carry a value, read by
# slicing: `f(a)[1:]`. mathema's own test suite verifies each row
# against the installed pandas.
compendium: pandas
versions: ">=2,<4"

pandas.Series.shift:
  claims:
    - name: shifted
      statement: "for a in R^n \\ {∅}, assuming dim(a) >= 2, f(a)[1:] == a[:-1]"
      note: "periods defaults to 1; position 0 is missing."
    - name: shifted@periods=2
      statement: "let periods be 2, for a in R^n \\ {∅}, assuming dim(a) >= 3, f(a)[2:] == a[:-2]"

pandas.Series.diff:
  claims:
    - name: differences
      statement: "for a in R^n \\ {∅}, assuming dim(a) >= 2, f(a)[1:] ~= a[1:] - a[:-1]"
      note: "periods defaults to 1; position 0 is missing."

pandas.Series.pct_change:
  claims:
    - name: changes
      statement: "for a in R^n \\ {∅}, assuming dim(a) >= 2 and min(abs(a)) > 0, f(a)[1:] ~= a[1:] / a[:-1] - 1"
      note: "The relative change from the previous element; position 0 is missing, and a zero previous element gives an infinite or missing change."

pandas.Series.size:
  claims:
    - name: definition
      statement: "for a in R^n \\ {∅}, f(a) == dim(a)"
      note: "Every position, missing or not; count(a) counts the positions with a value."
