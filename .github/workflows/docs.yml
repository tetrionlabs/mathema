# .github/workflows/docs.yml
#
# Docs deploy is an EXPLICIT step, not a side effect of commits: it
# fires when a GitHub Release is published (which you create from a
# version tag), or when triggered by hand from the Actions tab
# (workflow_dispatch) for an out-of-band docs fix. Ordinary pushes to
# main never build or deploy docs, so frequent code commits cost
# nothing on Cloudflare.
#
# On the release event, checkout resolves to the release's tag, so the
# published docs always match the released code exactly.
#
# One-time setup this workflow assumes:
#   Cloudflare dashboard:
#     - an API token with Workers Scripts:Edit on the account, stored
#       as the repo secret CLOUDFLARE_API_TOKEN
#     - the account id, stored as CLOUDFLARE_ACCOUNT_ID
#     - after the first deploy: attach the custom domain
#       mathema.tetrionlabs.com to the "mathema-docs" Worker
#       (Workers -> mathema-docs -> Domains). Do this a day before any
#       announcement so TLS is settled.
#   Repo root: the wrangler.jsonc below.
#
# --strict is the quality gate: a broken link, a missing reference, or
# a mkdocstrings failure fails the deploy rather than shipping.

name: docs

on:
  release:
    types: [published]
  workflow_dispatch: {}   # manual deploy for docs-only fixes

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # release event: this is the tag's tree; dispatch: current main

      - uses: astral-sh/setup-uv@v7

      # The mathema-language reference, imported under /language/reference/
      # by docs_hooks/language_reference.py. A deploy always carries it,
      # at the package's latest release tag (the highest v* tag), or at
      # the MATHEMA_LANGUAGE_DOCS_REF repository variable when that is
      # set; with no release tag and no variable the deploy stops. The
      # repository is public, so the workflow's own token reads it; the
      # MATHEMA_LANGUAGE_DOCS_TOKEN secret is optional and used when set.
      - name: Resolve the language reference's release
        id: langref
        env:
          GH_TOKEN: ${{ secrets.MATHEMA_LANGUAGE_DOCS_TOKEN || github.token }}
          PINNED: ${{ vars.MATHEMA_LANGUAGE_DOCS_REF }}
        run: |
          ref="$PINNED"
          if [ -z "$ref" ]; then
            ref=$(gh api repos/tetrionlabs/mathema-language/tags --paginate --jq '.[].name' \
                  | grep -E '^v[0-9]' | sort -V | tail -n 1)
          fi
          if [ -z "$ref" ]; then
            echo "no release tag of mathema-language to publish the reference from"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Fetch the language reference
        uses: actions/checkout@v7
        with:
          repository: tetrionlabs/mathema-language
          ref: ${{ steps.langref.outputs.ref }}
          path: _external/mathema-language
          token: ${{ secrets.MATHEMA_LANGUAGE_DOCS_TOKEN || github.token }}
          sparse-checkout: docs

      - name: The language reference is present
        run: test -f _external/mathema-language/docs/reference.yml

      - name: Build the site (strict)
        env:
          LEGAL_FOOTER: ${{ vars.DOCS_LEGAL_FOOTER }}
        run: |
          uv venv
          uv pip install -e ".[docs]"
          # an unset repository variable expands to an empty string, which
          # mkdocs would render as an empty footer rather than the fallback
          if [ -n "$LEGAL_FOOTER" ]; then export DOCS_LEGAL_FOOTER="$LEGAL_FOOTER"; fi
          uv run mkdocs build --strict

      - name: Deploy to Cloudflare Workers static assets
        uses: cloudflare/wrangler-action@v4
        with:
          # Pinned to 4: this is an assets-only Worker, which has no
          # `main` script because Cloudflare serves ./site directly.
          # The action's bundled 3.90 predates that and reports a
          # missing entry point instead, since it expects every deploy
          # to name a script.
          wranglerVersion: "4"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
