# Claims about numpy's scalar functions. An `is_defined` row states the
# region where the function has a value, a fact about the mathematics
# (outside it numpy returns nan with a RuntimeWarning rather than
# raising, which is no value all the same); the bare `is_defined(f)`
# states totality. An `is_overflow_safe` row states the region where the
# computation stays inside float range, a fact about numpy on float64
# (outside it numpy returns an infinity with a RuntimeWarning): it feeds
# the hazard points and the computation-safety checks, never a proof.
# A row's note says what the library does outside the region. power and
# float_power have no single-relation region and state no rows yet; what
# is known about them is the comment above each key.
compendium: numpy
versions: ">=1.24,<3"

numpy.sqrt:
  claims:
    - name: is_defined
      statement: "x >= 0"
      note: "Principal square root; a negative input returns nan with a RuntimeWarning, never raises."

numpy.log:
  claims:
    - name: is_defined
      statement: "x > 0"
      note: "Natural logarithm; x = 0 returns -inf and x < 0 returns nan, never raises."

numpy.log2:
  claims:
    - name: is_defined
      statement: "x > 0"
      note: "Base-2 logarithm; x = 0 returns -inf and x < 0 returns nan."

numpy.log10:
  claims:
    - name: is_defined
      statement: "x > 0"
      note: "Base-10 logarithm; x = 0 returns -inf and x < 0 returns nan."

numpy.log1p:
  claims:
    - name: is_defined
      statement: "x > -1"
      note: "log(1 + x); x = -1 returns -inf and x < -1 returns nan."

numpy.arcsin:
  claims:
    - name: is_defined
      statement: "-1 <= x <= 1"
      note: "Inverse sine; input outside [-1, 1] returns nan with a RuntimeWarning."

numpy.arccos:
  claims:
    - name: is_defined
      statement: "-1 <= x <= 1"
      note: "Inverse cosine; input outside [-1, 1] returns nan with a RuntimeWarning."

numpy.arccosh:
  claims:
    - name: is_defined
      statement: "x >= 1"
      note: "Inverse hyperbolic cosine; x < 1 returns nan with a RuntimeWarning."

numpy.arctanh:
  claims:
    - name: is_defined
      statement: "-1 < x < 1"
      note: "Inverse hyperbolic tangent; abs(x) = 1 returns an infinity and abs(x) > 1 returns nan."

numpy.exp:
  claims:
    - name: is_defined
      statement: "is_defined(f)"
    - name: is_overflow_safe
      statement: "x <= 709.782712893384"
      note: "Exponential; overflows to inf above roughly x = 709.78, with a RuntimeWarning."

numpy.exp2:
  claims:
    - name: is_defined
      statement: "is_defined(f)"
    - name: is_overflow_safe
      statement: "x < 1024"
      note: "2 to the power x; overflows to inf above roughly x = 1024."

numpy.expm1:
  claims:
    - name: is_defined
      statement: "is_defined(f)"
    - name: is_overflow_safe
      statement: "x <= 709.782712893384"
      note: "exp(x) - 1; overflows to inf for large x."

numpy.cosh:
  claims:
    - name: is_defined
      statement: "is_defined(f)"
    - name: is_overflow_safe
      statement: "-710.475860073944 < x < 710.475860073944"
      note: "Hyperbolic cosine; overflows to inf for abs(x) above roughly 710."

numpy.sinh:
  claims:
    - name: is_defined
      statement: "is_defined(f)"
    - name: is_overflow_safe
      statement: "-710.475860073944 < x < 710.475860073944"
      note: "Hyperbolic sine; overflows to an infinity for large abs(x)."

# x1 to the power x2; a negative base with a non-integer exponent returns nan, and large results overflow to an infinity.
numpy.power:
  claims: []

# power computed in floating point; the same nan and overflow behaviour as power.
numpy.float_power:
  claims: []

numpy.divide:
  claims:
    - name: is_defined
      statement: "x2 != 0"
      note: "Division; x1 / 0 returns an infinity and 0 / 0 returns nan, with a RuntimeWarning, never raises."
    - name: is_overflow_safe
      statement: "abs(x1) <= 1.7976931348623157e308 * abs(x2)"
      note: "The quotient stays inside float64 range; a larger quotient returns an infinity with a RuntimeWarning."

numpy.true_divide:
  claims:
    - name: is_defined
      statement: "x2 != 0"
      note: "Division; x1 / 0 returns an infinity and 0 / 0 returns nan, with a RuntimeWarning, never raises."
    - name: is_overflow_safe
      statement: "abs(x1) <= 1.7976931348623157e308 * abs(x2)"
      note: "The quotient stays inside float64 range; a larger quotient returns an infinity with a RuntimeWarning."

numpy.reciprocal:
  claims:
    - name: is_defined
      statement: "x != 0"
      note: "1 / x; the reciprocal of 0 returns inf, never raises, and an integer input's reciprocal truncates."
