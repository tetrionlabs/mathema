# .github/workflows/release.yml
#
# Tag-triggered release: stamp the licence, build, verify, publish.
# Publishing uses PyPI Trusted Publishing (OIDC): GitHub proves the
# workflow's identity to PyPI, so no API token is stored anywhere.
#
# One-time setup this workflow assumes:
#   TestPyPI first (required before any real publish): create the
#     account, then Publishing -> add a pending trusted publisher for
#     project "mathema": owner tetrionlabs, repo mathema, workflow
#     release.yml, environment testpypi.
#   PyPI: same steps under whichever account owns the project. A
#     maintainer's personal account is fine to start; trusted
#     publishing is identical either way, and a company account can be
#     added as an owner later without republishing.
#   GitHub repo -> Settings -> Environments:
#     create "testpypi" (no protection) and "pypi" with a required
#     reviewer, so the final publish is an explicit click.
#
# Release procedure: on a release branch cut from develop, bump
# `__version__`, run scripts/stamp_license.py and add the CHANGELOG
# entry; dispatch tests.yml on that branch, which runs the full
# interpreter matrix; open the pull request into main. Once it is
# merged, tag the merge commit vX.Y.Z and push the tag. This workflow
# then checks that the tagged tree passed a full-matrix run, builds,
# smoke-tests the built wheel, publishes, creates the GitHub Release
# from the CHANGELOG entry and deploys the docs.
# Stamping before the tag means the tag's tree, the public export and
# the built artefacts all carry the same concrete Change Date. This
# workflow only VERIFIES that stamp; it never writes one, so the date
# that ships is always the date a person committed and reviewed.

name: release

on:
  push:
    tags: ["v*"]
  # A rehearsal. Runs the whole pipeline (suite, lint, version guard,
  # licence check, build, artefact verification) and STOPS before
  # either publish, so the release can be proven end to end without a
  # tag and without anything reaching an index. A release-candidate
  # tag cannot serve this purpose: the version guard compares the tag
  # against `__version__`, so `v0.6.0rc1` would fail it by design.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rehearse; must equal mathema.__version__"
        required: true

permissions:
  contents: read
  actions: read

# One release per tag, never cancelled: a half-cancelled publish is
# worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The cheap guards first. Both take seconds and both are absolute:
  # a version that does not match, or an unstamped licence, cannot
  # become a release however green the suite is. Running them ahead of
  # the matrix turns an hour of wasted runner time into half a minute.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Version from tag matches the package
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_VERSION="${{ inputs.version }}"
          else
            TAG_VERSION="${GITHUB_REF_NAME#v}"
          fi
          PKG_VERSION="$(python -c 'import re,pathlib;print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("mathema/__init__.py").read_text()).group(1))')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag $TAG_VERSION != package $PKG_VERSION" >&2; exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      # Deliberately a CHECK, not a stamp. The licence is stamped and
      # committed by a person before the tag, so the tag's tree, the
      # public export and the artefacts all carry the same reviewed
      # Change Date. Re-stamping here would silently rewrite that date
      # to whenever CI happened to run, which is a different legal
      # statement from the one that was reviewed.
      - name: LICENSE is stamped for this version
        run: |
          python scripts/stamp_license.py \
            --version "${{ steps.ver.outputs.version }}" --check \
            || { echo "::error::LICENSE.md is not stamped for ${{ steps.ver.outputs.version }}. Run scripts/stamp_license.py --version ${{ steps.ver.outputs.version }} locally, commit it, and re-tag."; exit 1; }

      # A tag must never publish code the suite has not passed on every
      # supported interpreter. A dispatched tests.yml run tests the full
      # matrix (3.10 to 3.14); this step finds a successful one whose
      # commit has exactly the tagged tree. Trees, not commits, because
      # the tag sits on main's merge commit while the run was on the
      # release branch: the same files, a different commit.
      - name: The tagged tree passed the full interpreter matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          found=""
          for sha in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow tests.yml \
                         --event workflow_dispatch --status success --limit 200 \
                         --json headSha --jq '.[].headSha'); do
            git cat-file -e "$sha^{commit}" 2>/dev/null || continue
            if [ "$(git rev-parse "$sha^{tree}")" = "$tree" ]; then found="$sha"; break; fi
          done
          if [ -z "$found" ]; then
            echo "::error::no successful full-matrix tests.yml run has this tree ($tree). Dispatch tests.yml on the release branch, wait for it to pass, then re-run this workflow."
            exit 1
          fi
          echo "the tagged tree passed the full matrix at $found"

  lint:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy mathema
      - run: python mathema/_devtools/check_headers.py $(git ls-files -- '*.py')
      - run: python mathema/_devtools/check_prose.py

  build:
    needs: [validate, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet build twine
          python -m build
          python -m twine check dist/*

      - name: Verify the stamp landed in the artefacts
        run: |
          # The stamped LICENSE must be inside both artefacts, not only in the tree.
          python - <<'EOF'
          import glob, sys, tarfile, zipfile
          version = "${{ needs.validate.outputs.version }}"
          needle = f"mathema {version}".encode()

          sdist = glob.glob("dist/*.tar.gz")[0]
          with tarfile.open(sdist) as tar:
              names = [n for n in tar.getnames() if n.endswith("LICENSE.md")]
              assert names, "no LICENSE.md in the sdist"
              assert needle in tar.extractfile(names[0]).read(), \
                  "the sdist's LICENSE.md is not stamped"

          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as z:
              names = [n for n in z.namelist() if n.endswith("LICENSE.md")]
              assert names, "no LICENSE.md in the wheel"
              assert needle in z.read(names[0]), \
                  "the wheel's LICENSE.md is not stamped"
              # every bundled compendium file in the checkout is in the wheel
              shipped = set(z.namelist())
              bundled = glob.glob("mathema/compendium/**/*.yaml", recursive=True)
              assert bundled, "no bundled compendium files in the checkout"
              missing = sorted(p for p in bundled if p not in shipped)
              assert not missing, f"compendium files missing from the wheel: {missing}"
          print(f"both artefacts carry the stamped LICENSE for {version}")
          print(f"the wheel carries all {len(bundled)} bundled compendium files")
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # The built wheel, installed alone into a clean interpreter at each
  # end of the supported range, reads, proves and falsifies.
  smoke:
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/release_smoke.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: python -m venv /tmp/smoke && /tmp/smoke/bin/pip install --quiet dist/*.whl
      - run: cd /tmp && /tmp/smoke/bin/python "$GITHUB_WORKSPACE/scripts/release_smoke.py" "${{ needs.validate.outputs.version }}"

  publish-testpypi:
    # never on a rehearsal
    if: github.event_name == 'push'
    needs: smoke
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write   # OIDC: this is what replaces an API token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    # Gated by the "pypi" environment's required reviewer: the real
    # publish happens only after an explicit approval in the GitHub UI,
    # ideally after a clean-venv install from TestPyPI has been tried.
    if: github.event_name == 'push'
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The GitHub Release, with the version's CHANGELOG entry as its notes.
  github-release:
    if: github.event_name == 'push'
    needs: [validate, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Notes from the CHANGELOG entry
        run: |
          python3 - "${{ needs.validate.outputs.version }}" > notes.md <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## {re.escape(version)}\s*\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          if not match or not match.group(1).strip():
              sys.exit(f"CHANGELOG.md has no entry for {version}")
          print(match.group(1).strip())
          PY
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "mathema ${{ needs.validate.outputs.version }}" --notes-file notes.md

  # A release created with the workflow's own token starts no other
  # workflow, so the docs deploy is called here rather than waiting on
  # the release event.
  docs:
    needs: github-release
    permissions:
      contents: read
    uses: ./.github/workflows/docs.yml
    secrets: inherit
