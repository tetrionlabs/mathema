name: tests

on:
  push:
    branches: [main, develop]
    # Keep this list to files that CANNOT affect a test outcome: a
    # skipped run is a commit with no verdict. Documentation is not on
    # it: the suite runs every documented example and compares its
    # output (tests/test_docs_outputs.py), so a page edit can break a
    # test. The site build itself is docs-check.yml's job.
    paths-ignore: &docs-paths
      - "mkdocs.yml"
      - "LICENSE.md"
      - "NOTICE"
      - "CITATION.cff"
      - ".gitignore"
      - ".gitattributes"
  pull_request:
    paths-ignore: *docs-paths
  # The full interpreter matrix weekly, so drift on an interpreter the
  # per-push tier does not exercise still surfaces within days.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

# A new push to the same branch cancels the run it superseded. Never
# on main: a push there is a release candidate and its run should
# complete rather than be cancelled by the next one.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege by default: no job here writes anything.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Tiered by cost. The suite takes roughly sixteen to twenty
        # three minutes per interpreter on a shared runner, so all four
        # on every push bills about ninety minutes and buys little that
        # the release tag does not: release.yml runs the whole matrix
        # before it publishes, which is the gate that matters.
        #
        # Per push we run the FLOOR and the CEILING of the supported
        # range. Version-specific breakage is nearly always at one end
        # (a stdlib module that does not exist yet at the floor, a
        # removal at the ceiling), so two interpreters catch it at
        # roughly a third of the cost. The middle of the range, and the
        # pre-release canary, run weekly and on demand.
        python-version: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && fromJSON('["3.10", "3.11", "3.12", "3.13", "3.14"]')
          || fromJSON('["3.10", "3.14"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[test]'
      # the main suite runs with no language package: core must parse,
      # render and record L[...] and resolve no name on its own
      - name: no language package is installed
        run: python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('mathema_language') is not None)"
      - run: python -m pytest -q

  # The core install alone: no optional extra, so the degraded paths
  # (no numpy, no z3, no pandas or polars) are exercised as a user who
  # ran `pip install mathema` sees them. A test whose subject is an
  # extra skips itself (`needs_smt`, `importorskip`); everything else
  # must pass here, which is the check that the degraded path is honest.
  core-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e . pytest pytest-xdist
      - name: no optional extra is installed
        run: python -c "import importlib.util, sys; sys.exit(any(importlib.util.find_spec(m) for m in ('numpy', 'pandas', 'polars', 'z3', 'coverage', 'mcp')))"
      - run: python -m pytest -q -n 4

  # The bundled compendium rows adjudicated against the libraries
  # (`--third-party-compendiums`): a red here is a library that changed
  # under a row, or a row that misreads it. Runs when a bundled compendium file
  # or the lock file changes, weekly, and on demand, at the two ends only:
  # the supported floor (Python 3.10 with numpy 2.0, pandas 2.2 and polars
  # 1.0) and the ceiling (Python 3.14 with the libraries pip resolves today).
  third-party-compendiums:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            libraries: "numpy==2.0.* pandas==2.2.* polars==1.0.*"
          - python-version: "3.14"
            libraries: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: a compendium file or the lock file changed
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/$BASE_REF...HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="HEAD~1...HEAD"
          else
            range="$BEFORE...HEAD"
          fi
          if git diff --name-only "$range" mathema/compendium uv.lock | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.changed.outputs.run == 'true'
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: steps.changed.outputs.run == 'true'
        run: pip install -e '.[test]'
      - if: steps.changed.outputs.run == 'true' && matrix.libraries != ''
        env:
          LIBRARIES: ${{ matrix.libraries }}
        run: pip install $LIBRARIES
      - if: steps.changed.outputs.run == 'true'
        run: python -m pytest -n 4 -q -m third_party_compendiums --third-party-compendiums

  # `requires-python` is deliberately unbounded above (capping it
  # would strand users on a new interpreter until we cut a release),
  # so pip WILL install mathema on a Python newer than anything
  # tested. This job is how we find out before a user does. It may
  # fail: a red here is information about an unreleased interpreter,
  # never a reason to block a pull request.
  test-prerelease:
    # Early warning only, and it costs a full suite run, so it rides
    # the weekly schedule rather than every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          allow-prereleases: true
      - run: pip install -e '.[test]'
      - run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # the declared dev extra, so CI and a contributor's machine run
      # the same tool versions instead of drifting apart
      - run: pip install -e '.[dev]' types-PyYAML
      - run: ruff check .
      - run: mypy mathema
      - run: python mathema/_devtools/check_headers.py $(git ls-files -- '*.py')
      - run: python mathema/_devtools/check_prose.py
      # report-only: applying the mathema-docstring convention to our
      # own public surface, a visible number, never a gate.
      - run: python -m mathema._devtools.docs_report

  # The runtime dependency surface is two packages, so an audit is
  # cheap and a finding is actionable rather than noise.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pip-audit
      # --skip-editable passes over mathema itself, which is not on
      # PyPI to be audited against. NOT --strict: strict treats that
      # deliberate skip as an error, so the two contradict each other
      # and the job would fail on every run.
      - run: pip-audit --desc --skip-editable
