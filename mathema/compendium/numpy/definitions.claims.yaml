# Definition rows for numpy: what each function computes, stated in
# the grammar's own words over inputs with nothing missing. numpy
# propagates a missing element (nan) to the result. The derive route
# reads a caller's `np.sum(x)` or `A.T` through these rows, and
# mathema's own test suite verifies each against the installed numpy.
compendium: numpy
versions: ">=1.24,<3"

numpy.prod:
  claims:
    - name: definition
      statement: "for a in R^n \\ {∅}, f(a) ~= prod(a)"

numpy.cumsum:
  claims:
    - name: definition
      statement: "for a in R^n \\ {∅}, f(a) ~= cumsum(a)"
      note: "The running sums: element i is the sum of the first i + 1 elements."
    - name: definition@axis=0
      statement: "let axis be 0, for a in R^(m,n) \\ {∅}, f(a) ~= cumsum(a, axis=0)"
      note: "The running sums down each column of a matrix."

numpy.cumprod:
  claims:
    - name: definition
      statement: "for a in R^n \\ {∅}, f(a) ~= cumprod(a)"
      note: "The running products: element i is the product of the first i + 1 elements."

numpy.trace:
  claims:
    - name: definition
      statement: "for a in R^(n,n) \\ {∅}, f(a) ~= trace(a)"

numpy.transpose:
  claims:
    - name: definition
      statement: "for a in R^(m,n) \\ {∅}, f(a) == transpose(a)"

numpy.linalg.inv:
  claims:
    - name: definition
      statement: "for a in R^(n,n) \\ {∅}, assuming det(a) != 0, f(a) ~= inv(a)"
      note: "A singular matrix raises LinAlgError."

numpy.linalg.det:
  claims:
    - name: definition
      statement: "for a in R^(n,n) \\ {∅}, f(a) ~= det(a)"

numpy.ndarray.mean:
  claims:
    - name: definition
      statement: "for a in R^n \\ {∅}, f(a) ~= mean(a)"
      note: "The method `a.mean()`; its receiver is `a`."

numpy.ndarray.std:
  claims:
    - name: definition
      statement: "for a in R^n \\ {∅}, f(a) ~= std(a, ddof=0)"
      note: "The method `a.std()`: ddof defaults to 0."
    - name: definition@ddof=1
      statement: "let ddof be 1, for a in R^n \\ {∅}, assuming dim(a) >= 2, f(a) ~= std(a, ddof=1)"

numpy.ndarray.sum:
  claims:
    - name: definition
      statement: "for a in R^n \\ {∅}, f(a) ~= sum(a)"

numpy.ndarray.T:
  claims:
    - name: definition
      statement: "for a in R^(m,n) \\ {∅}, f(a) == transpose(a)"
      note: "The attribute `a.T`, the transpose."

numpy.sum:
  claims:
    - name: definition
      statement: "for a in R^n \\ {∅}, f(a) ~= sum(a)"
      note: "Stated for a vector: the sum of its elements. Holds by execution on every numpy the file covers."
    - name: definition@axis=0
      statement: "let axis be 0, for a in R^(m,n) \\ {∅}, f(a) ~= sum(a, axis=0)"
      note: "The sum of each column of a matrix."
    - name: definition@axis=1
      statement: "let axis be 1, for a in R^(m,n) \\ {∅}, f(a) ~= sum(a, axis=1)"
      note: "The sum of each row of a matrix."
