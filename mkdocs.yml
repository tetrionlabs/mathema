site_name: mathema
site_description: "Claim-Driven Development: turn software intent into verifiable evidence."
site_url: https://mathema.tetrionlabs.com
repo_name: tetrionlabs/mathema
repo_url: https://github.com/tetrionlabs/mathema
# The deployed footer carries the company's legal details from the
# DOCS_LEGAL_FOOTER repository variable (set in the repo's Actions
# settings, passed by docs.yml); every other build uses the short line.
copyright: !ENV [DOCS_LEGAL_FOOTER, "Copyright 2026 Tetrion Ltd"]
theme:
  name: material
  custom_dir: overrides
  logo: assets/tetrion-mark-light.svg
  favicon: assets/favicon.ico
  font: false
  icon:
    repo: octicons/mark-github-24
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: octicons/sun-24
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: octicons/moon-24
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/tokens.css
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - llmstxt:
      markdown_description: >-
        mathema is a System 0 engine for Claim-Driven Development: a
        verification engine with zero models between the code and its
        verdict. You state claims about Python functions; mathema proves
        them symbolically where the function lifts, tests them against the
        real code where it does not, and keeps a record bound to the exact
        code it verified. Verdicts are proven, holds (n trials), falsified
        (with an executed witness), invalidated, unknown and skipped, and
        each means exactly what the guarantees page says. Agents propose
        claims; mathema adjudicates; people accept.
      full_output: llms-full.txt
      sections:
        Start here:
          - index.md: What mathema is and why it exists
          - install.md: Installing mathema
          - quickstart.md: State a claim, see it falsified, fix it, record it, gate CI
          - tutorial.md: The full claim-driven development loop on a real function
        Concepts:
          - guarantees.md: What each verdict establishes and does not, and the glossary
          - evidence-ladder.md: How proof and sampled evidence are kept apart
          - cdd.md: The method, its vocabulary and exit codes
          - derive-route.md: What the symbolic route can lift and prove
          - claims-transfer.md: Moving claims between projects and implementations
          - reason-codes.md: Stable reason codes and their remedies
        Trust and governance:
          - governance.md: Who decides what, the integrity checksum, the CI gate
          - security.md: What runs when a claim is checked, and how to contain it
        Writing claims:
          - authoring.md: The authoring surfaces and their precedence
          - grammar.md: The claim grammar, domains and tolerance
          - multi-function-claims.md: Binding functions and the equivalence ladder
          - lemmas.md: Claims that rest on other claims
        Commands:
          - modes/check.md: Check a function's claims
          - modes/verify.md: The CI gate over the committed store
          - modes/accept.md: Human acceptance of a verdict
          - modes/review.md: The claim-level delta of a change
        Coding agents:
          - agents.md: Working with coding agents
          - modes/mcp.md: The MCP interface
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            docstring_style: google

nav:
  - Home: index.md
  - Get started:
      - Install: install.md
      - Quick start: quickstart.md
      - See what mathema finds: findings.md
      - A first look: first-look.md
      - The CDD loop, end to end: tutorial.md
      - Case studies: case-studies.md
  - Concepts:
      - Guarantees and limits: guarantees.md
      - The evidence ladder: evidence-ladder.md
      - Intent, implementation and behaviour: three-layers.md
      - Claims transfer: claims-transfer.md
      - "The method: claim-driven development": cdd.md
      - The derive route: derive-route.md
      - Reason codes: reason-codes.md
  - Writing claims:
      - Authoring claims: authoring.md
      - The claim grammar: grammar.md
      - The mathema docstring: mathema-docstring.md
      - Conditional claims: conditional-claims.md
      - Lemmas: lemmas.md
      - Matrix structure and linear algebra: matrix-structure.md
      - Multi-function claims: multi-function-claims.md
  - Command reference:
      - mathema check: modes/check.md
      - mathema verify: modes/verify.md
      - mathema audit: modes/audit.md
      - mathema claims: modes/claims.md
      - mathema accept: modes/accept.md
      - mathema lock and unlock: modes/lock.md
      - mathema pin: modes/pin.md
      - mathema review: modes/review.md
      - mathema badges: modes/badges.md
      - mathema describe: modes/describe.md
      - mathema docsync: modes/docsync.md
      - mathema init: modes/init.md
  - Using mathema from code:
      - Library usage: modes/library.md
      - API reference: api.md
      - Symbology and rendering: symbology.md
      - Extending mathema: extending.md
  - Trust and governance:
      - Governance and audit: governance.md
      - Security and execution: security.md
  - Coding agents:
      - Working with coding agents: agents.md
      - The MCP interface: modes/mcp.md
  - Project:
      - Licensing: licensing-policy.md
      - Versioning and stability: stability.md
      - Changelog: https://github.com/tetrionlabs/mathema/blob/main/CHANGELOG.md
