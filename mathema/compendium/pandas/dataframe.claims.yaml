# Rows for pandas.DataFrame's elementwise methods, stated over tables
# with nothing missing; the receiver of `df.abs()` is `a`, `a.x` is its
# column `x`, and `f(a)["x"]` is the result's column `x`, read by name
# whatever the table's other columns. A column read (`df.x`, `df["x"]`)
# is itself grammar: a claim reads it as a vector, and the derive route
# reads a method called on it through the pandas.Series rows. mathema's
# own test suite verifies each row against the installed pandas.
compendium: pandas
versions: ">=2,<4"

pandas.DataFrame.abs:
  claims:
    - name: columns
      statement: "for a in R^n \\ {∅}, f(a)[\"x\"] == abs(a.x)"
      note: "Element by element, a table of the same shape."

pandas.DataFrame.cumsum:
  claims:
    - name: columns
      statement: "for a in R^n \\ {∅}, f(a)[\"x\"] ~= cumsum(a.x)"
      note: "The running sums down each column."
