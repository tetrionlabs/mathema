# Documentation changes get their own gate. Building the site with
# --strict catches a broken link, a nav orphan or a bad reference in
# about a minute, where the full test suite is slow and could not
# fail for a prose edit anyway.
name: docs-check

on:
  push:
    branches: [main, develop]
    paths: &docs-paths
      - "docs/**"
      - "**.md"
      - "mkdocs.yml"
      - "docs_hooks/**"
      - ".github/workflows/docs-check.yml"
  pull_request:
    paths: *docs-paths

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LANGUAGE_DOCS_TOKEN: ${{ secrets.MATHEMA_LANGUAGE_DOCS_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[docs]'
      # the mathema-language reference, imported under /language/reference/
      # by docs_hooks/language_reference.py, is always part of the check.
      # The repository is public, so the workflow's own token reads it;
      # the MATHEMA_LANGUAGE_DOCS_TOKEN secret is optional and used when
      # set. The ref is the variable when set, else the package's latest
      # release tag; with neither the check fails.
      - name: resolve the language reference's release
        id: langref
        env:
          GH_TOKEN: ${{ env.LANGUAGE_DOCS_TOKEN }}
          PINNED: ${{ vars.MATHEMA_LANGUAGE_DOCS_REF }}
        run: |
          ref="$PINNED"
          if [ -z "$ref" ]; then
            ref=$(gh api repos/tetrionlabs/mathema-language/tags --paginate --jq '.[].name' \
                  | grep -E '^v[0-9]' | sort -V | tail -n 1)
          fi
          if [ -z "$ref" ]; then
            echo "no release tag of mathema-language to check the reference from"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: fetch the language reference
        uses: actions/checkout@v4
        with:
          repository: tetrionlabs/mathema-language
          ref: ${{ steps.langref.outputs.ref }}
          path: _external/mathema-language
          token: ${{ env.LANGUAGE_DOCS_TOKEN }}
          sparse-checkout: docs
      - name: the language reference is present
        run: test -f _external/mathema-language/docs/reference.yml
      # --strict promotes warnings to errors, so an orphaned page or a
      # dangling anchor fails here rather than at deploy time
      - run: mkdocs build --strict
