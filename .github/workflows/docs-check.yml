# Documentation changes get their own gate. Building the site with
# --strict catches a broken link, a nav orphan or a bad reference in
# about a minute, where the full test suite is slow and could not
# fail for a prose edit anyway.
name: docs-check

on:
  push:
    branches: [main, develop]
    paths: &docs-paths
      - "docs/**"
      - "**.md"
      - "mkdocs.yml"
      - "docs_hooks/**"
      - ".github/workflows/docs-check.yml"
  pull_request:
    paths: *docs-paths

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LANGUAGE_DOCS_TOKEN: ${{ secrets.MATHEMA_LANGUAGE_DOCS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[docs]'
      # the mathema-language reference, imported under /language/reference/
      # by docs_hooks/language_reference.py. The repository is private
      # until release, so the checkout needs a token that can read it; a
      # build without one (a fork's pull request) checks the site alone.
      - name: fetch the language reference
        if: ${{ env.LANGUAGE_DOCS_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: tetrionlabs/mathema-language
          ref: ${{ vars.MATHEMA_LANGUAGE_DOCS_REF || 'main' }}
          path: _external/mathema-language
          token: ${{ env.LANGUAGE_DOCS_TOKEN }}
          sparse-checkout: docs
      # --strict promotes warnings to errors, so an orphaned page or a
      # dangling anchor fails here rather than at deploy time
      - run: mkdocs build --strict
