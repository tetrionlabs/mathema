# Definition rows for the least and greatest elements, the absolute
# value, the square root and the inner product of a polars.Series,
# stated over Series with nothing missing; the receiver of
# `returns.min()` is `a`. mathema's own test suite verifies each row
# against the installed polars.
compendium: polars
versions: ">=1,<2"

polars.Series.min:
  claims:
    - name: definition
      statement: "for a in R^n \\ {∅}, f(a) == min(a)"

polars.Series.max:
  claims:
    - name: definition
      statement: "for a in R^n \\ {∅}, f(a) == max(a)"

polars.Series.abs:
  claims:
    - name: definition
      statement: "for a in R^n \\ {∅}, f(a) == abs(a)"
      note: "Element by element, a Series of the same length."

polars.Series.sqrt:
  claims:
    - name: definition
      statement: "for a in R^n \\ {∅}, assuming min(a) >= 0, f(a) ~= a ** 0.5"
      note: "Element by element; a negative element gives NaN."

polars.Series.dot:
  claims:
    - name: definition
      statement: "for a in R^n \\ {∅}, other in R^n \\ {∅}, f(a, other) ~= dot(a, other)"
      note: "The inner product with a Series of the same length."
